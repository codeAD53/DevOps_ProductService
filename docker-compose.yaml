services:
  mongo:
    image: mongo:6.0
    container_name: product_mongo
    restart: unless-stopped

    ports:
      - "27017:27017"
    volumes: 
      - mongo_data:/data/db
  
  server:
    # image: product-service:latest
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: product_server
    restart: unless-stopped

    ports:
      - "5000:5000"
    
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/productdb

    depends_on:
      - mongo

volumes:
  mongo_data:
    driver: local